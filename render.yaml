services:
  - type: web
    name: aurorape-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aurorape-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: DEBUG
        value: "false"
      - key: MOCK_MODE
        value: "false"
      - key: SITE_NAME
        value: Aurora PE
      - key: SITE_URL
        value: https://aurorape.com.br
      - key: CORS_ORIGINS
        value: https://aurorape.vercel.app

databases:
  - name: aurorape-db
    plan: free
