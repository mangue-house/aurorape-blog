<header class="site-header" role="banner">
  <div class="container">
    <a href="/" class="site-header__logo" aria-label="Aurora PE — Página inicial">
      <img src="{{ request.url_for('static', path='images/logo.svg') }}" alt="Aurora PE" />
      <span class="site-header__logo-text">Aurora PE</span>
    </a>

    <nav class="site-header__nav" aria-label="Navegação principal">
      {% for cat in categories %}
      <a href="/categoria/{{ cat.slug }}"
         {% if request.url.path == '/categoria/' ~ cat.slug %}aria-current="page"{% endif %}>
        {{ cat.name }}
      </a>
      {% endfor %}
    </nav>

    <div class="site-header__actions">
      <button class="btn-search" id="btn-search" aria-label="Buscar" aria-controls="search-overlay" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
      <a href="/apoie" class="btn-subscribe">Apoie</a>
      <button class="btn-menu" id="btn-menu" aria-label="Abrir menu" aria-controls="mobile-menu" aria-expanded="false">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>
  </div>

  <nav class="mobile-menu" id="mobile-menu" aria-label="Menu mobile">
    {% for cat in categories %}
    <a href="/categoria/{{ cat.slug }}">{{ cat.name }}</a>
    {% endfor %}
    <a href="/apoie">Apoie o Aurora PE</a>
  </nav>
</header>

<!-- Search overlay -->
<div class="search-overlay" id="search-overlay" role="dialog" aria-modal="true" aria-label="Busca">
  <div class="search-box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
      <span style="font-weight:600;">Buscar no Aurora PE</span>
      <button id="search-close" aria-label="Fechar busca"
              style="background:none;border:none;cursor:pointer;font-size:1.25rem;color:var(--color-muted);">✕</button>
    </div>
    <input
      type="search"
      name="q"
      placeholder="Digite para buscar..."
      autocomplete="off"
      hx-get="/busca"
      hx-trigger="keyup changed delay:400ms"
      hx-target="#search-results"
      hx-swap="innerHTML"
      aria-label="Campo de busca"
    />
    <div id="search-results" class="search-results" aria-live="polite"></div>
  </div>
</div>
