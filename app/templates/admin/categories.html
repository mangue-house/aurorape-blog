{% extends "admin/base.html" %}
{% block title %}Categorias{% endblock %}

{% block content %}
<div class="admin-topbar">
  <h1>Categorias</h1>
</div>

<div style="display:grid;gap:2rem;grid-template-columns:1fr 360px;">

  <div class="card">
    <table class="data-table">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Slug</th>
          <th>Descrição</th>
        </tr>
      </thead>
      <tbody>
        {% for cat in categories %}
        <tr>
          <td style="font-weight:600;">{{ cat.name }}</td>
          <td style="color:var(--color-muted);">{{ cat.slug }}</td>
          <td style="font-size:0.875rem;color:var(--color-muted);">{{ cat.description or '—' }}</td>
        </tr>
        {% else %}
        <tr>
          <td colspan="3" style="text-align:center;color:var(--color-muted);padding:2rem;">
            Nenhuma categoria cadastrada.
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <div class="card" style="padding:1.5rem;align-self:start;">
    <h2 style="font-size:1rem;font-weight:600;margin-bottom:1.25rem;">Nova categoria</h2>
    <form method="post" action="/admin/categorias">
      <div class="form-group">
        <label class="form-label" for="name">Nome *</label>
        <input class="form-control" type="text" id="name" name="name" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="slug">Slug *</label>
        <input class="form-control" type="text" id="slug" name="slug" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="description">Descrição</label>
        <textarea class="form-control" id="description" name="description" style="min-height:70px;"></textarea>
      </div>
      <button type="submit" class="btn-primary">Criar categoria</button>
    </form>
  </div>

</div>
{% endblock %}
