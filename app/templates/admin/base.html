<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Admin{% endblock %} — Aurora PE</title>
  <link rel="icon" href="{{ request.url_for('static', path='images/logo.avif') }}" type="image/avif" />
  <link rel="stylesheet" href="{{ request.url_for('static', path='css/main.css') }}" />
</head>
<body>
<div class="admin-layout">

  {# ── Sidebar ── #}
  <aside class="admin-sidebar">

    <a href="/admin/" class="admin-sidebar__brand">
      <img src="{{ request.url_for('static', path='images/logo.avif') }}" alt="Aurora PE" />
      <span class="admin-sidebar__brand-text">
        Aurora PE
        <small>Painel administrativo</small>
      </span>
    </a>

    <nav class="admin-nav" aria-label="Menu administrativo">

      <span class="admin-nav__label">Conteúdo</span>

      <a href="/admin/"
         {% if request.url.path == '/admin/' %}aria-current="page"{% endif %}>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>

      <a href="/admin/artigos"
         {% if request.url.path == '/admin/artigos' or ('/admin/artigos/' in request.url.path and request.url.path != '/admin/artigos/novo') %}aria-current="page"{% endif %}>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Artigos
      </a>

      <a href="/admin/artigos/novo"
         {% if request.url.path == '/admin/artigos/novo' %}aria-current="page"{% endif %}>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        Nova matéria
      </a>

      <hr class="admin-nav__divider" />
      <span class="admin-nav__label">Cadastros</span>

      <a href="/admin/autores"
         {% if '/admin/autores' in request.url.path %}aria-current="page"{% endif %}>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Autores
      </a>

      <a href="/admin/categorias"
         {% if '/admin/categorias' in request.url.path %}aria-current="page"{% endif %}>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
        Categorias
      </a>

      <div class="admin-nav__footer">
        <hr class="admin-nav__divider" />
        <a href="/" target="_blank" rel="noopener">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          Ver site
        </a>
        <a href="/admin/logout">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sair
        </a>
      </div>
    </nav>
  </aside>

  {# ── Main ── #}
  <main class="admin-main">
    {% block content %}{% endblock %}
  </main>

</div>
<script src="{{ request.url_for('static', path='js/htmx.min.js') }}" defer></script>
<script src="{{ request.url_for('static', path='js/admin.js') }}" defer></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
