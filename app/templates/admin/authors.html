{% extends "admin/base.html" %}
{% block title %}Autores{% endblock %}

{% block content %}
<div class="admin-topbar">
  <h1>Autores</h1>
</div>

<div style="display:grid;gap:2rem;grid-template-columns:1fr 380px;">

  <div class="card">
    <table class="data-table">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Slug</th>
          <th>Bio</th>
        </tr>
      </thead>
      <tbody>
        {% for author in authors %}
        <tr>
          <td style="font-weight:600;">{{ author.name }}</td>
          <td style="color:var(--color-muted);">{{ author.slug }}</td>
          <td style="font-size:0.875rem;color:var(--color-muted);max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
            {{ author.bio or '—' }}
          </td>
        </tr>
        {% else %}
        <tr>
          <td colspan="3" style="text-align:center;color:var(--color-muted);padding:2rem;">
            Nenhum autor cadastrado.
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <div class="card" style="padding:1.5rem;align-self:start;">
    <h2 style="font-size:1rem;font-weight:600;margin-bottom:1.25rem;">Novo autor</h2>
    <form method="post" action="/admin/autores">
      <div class="form-group">
        <label class="form-label" for="name">Nome *</label>
        <input class="form-control" type="text" id="name" name="name" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="slug">Slug *</label>
        <input class="form-control" type="text" id="slug" name="slug" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="bio">Bio</label>
        <textarea class="form-control" id="bio" name="bio" style="min-height:80px;"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label" for="photo_url">URL da foto</label>
        <input class="form-control" type="url" id="photo_url" name="photo_url" />
      </div>
      <button type="submit" class="btn-primary">Criar autor</button>
    </form>
  </div>

</div>
{% endblock %}
