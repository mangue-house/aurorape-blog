<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Aurora PE Admin</title>
  <link rel="icon" href="{{ request.url_for('static', path='images/logo.avif') }}" type="image/avif" />
  <link rel="stylesheet" href="{{ request.url_for('static', path='css/main.css') }}" />
</head>
<body class="login-page">
  <div class="login-card">

    <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0.5rem;">
      <img src="{{ request.url_for('static', path='images/logo.avif') }}" alt="Aurora PE"
           style="height:44px;width:auto;" />
      <div>
        <div style="font-family:var(--font-headline);font-size:1.3rem;font-weight:700;color:var(--color-primary);">
          Aurora PE
        </div>
        <div style="font-size:0.75rem;color:var(--color-muted);text-transform:uppercase;letter-spacing:0.08em;">
          Painel administrativo
        </div>
      </div>
    </div>

    <hr style="border:none;border-top:1px solid var(--color-border);margin:1.25rem 0;" />

    {% if error %}
    <div class="alert-error" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post" action="/admin/login">
      <div class="form-group">
        <label class="form-label" for="email">E-mail</label>
        <input class="form-control" type="email" id="email" name="email"
               placeholder="redacao@aurorape.com.br" required autofocus />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Senha</label>
        <input class="form-control" type="password" id="password" name="password"
               placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn-primary" style="width:100%;padding:0.75rem;font-size:1rem;margin-top:0.5rem;">
        Entrar
      </button>
    </form>

    <p style="text-align:center;font-size:0.8rem;color:var(--color-muted);margin-top:1.5rem;">
      <a href="/" style="color:var(--color-secondary);">← Voltar ao site</a>
    </p>
  </div>
</body>
</html>
